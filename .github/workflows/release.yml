name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with the release version
        run: python3 tools/build.py "${GITHUB_REF_NAME#v}"
      - name: Package the Claude skill
        run: cd skills && zip -r ../floorplan-setup-skill.zip floorplan-setup -x '*/__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glass-floorplan-card.js
            floorplan-setup-skill.zip
